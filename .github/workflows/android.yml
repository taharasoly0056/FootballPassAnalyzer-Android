      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Inspect Clang Libraries
        if: always()
        run: |
          NDK_DIR="/github/home/.buildozer/android/platform/android-ndk-r25b"

          echo "===== NDK DIRECTORY ====="
          echo "$NDK_DIR"

          echo "===== NDK CHECK ====="
          ls -la "$NDK_DIR" || true

          echo "===== CLANG LIBRARY DIRECTORIES ====="
          find "$NDK_DIR/toolchains/llvm/prebuilt" -maxdepth 7 -type d -path "*/lib/clang/*" 2>/dev/null || true

          echo "===== LIBOMP FILES ====="
          find "$NDK_DIR/toolchains/llvm/prebuilt" -name "libomp.so" 2>/dev/null || true

name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old Buildozer cache
        shell: bash
        run: |
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf .buildozer/android/platform/build-arm64-v8a

      - name: Check NDK and Clang paths
        shell: bash
        run: |
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "===== Clang directories in NDK ====="
          find "$ANDROIDNDK" -type d -path "*/lib/clang*" 2>/dev/null | head -100 || true

          echo "===== Clang runtime libraries ====="
          find "$ANDROIDNDK" -type f -name "libclang_rt.builtins*" 2>/dev/null | head -100 || true

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FootballPassAnalyzer-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FootballPassAnalyzer-Android-APK
          path: bin/*.apk
          if-no-files-found: error
